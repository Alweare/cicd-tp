name : pipeline-tp1
on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - 'master'
jobs:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@master
    - name: Checout le repo git
    - uses: actions/setup-node
      with:
        node-version: 24
        cache: 'npm'
    - name: Installer les dépendances
      run: npm ci
    - name: Lancer les tests
      run: npm test
    - name : Lint le code
      run: npm run lint